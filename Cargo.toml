[workspace]
resolver = "3"
members = ["chapters/*", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

# Every third-party crate the course uses is listed here, once, so versions
# stay consistent across chapters. Most chapters use none of them.
[workspace.dependencies]
rayon = "1.12"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "io-util"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Lint policy (explained in README.md, "How the code is checked").
# Pedantic is on. The allowed lints below fire constantly in numeric code for
# reasons we have already accepted; each chapter still documents the casts it
# relies on.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
many_single_char_names = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"

[profile.dev]
# Numeric code at opt-level 0 is 10-50x slower than release; level 1 keeps
# debug assertions and overflow checks but makes tests bearable.
opt-level = 1

[profile.release]
# Keep line tables so profilers can map samples back to source lines.
debug = "line-tables-only"
